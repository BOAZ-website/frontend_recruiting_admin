# 이슈·댓글 규칙 호출 파일 견본. 저장소 .github/workflows/에 같은 이름(repo-rule-keeper-issue.yml)으로 복사. 원본 변경은 v2 태그 이동으로 반영됨
name: '🛡️ repo-rule-keeper-issue'
on:
  issues: { types: [opened, edited, labeled, unlabeled, assigned, unassigned] }
  issue_comment: { types: [created, edited, deleted] }
permissions: { contents: read, issues: write, pull-requests: write, statuses: write }
concurrency:
  group: 'rrk-issue-${{ github.event.issue.number }}-${{ github.event_name }}'
  cancel-in-progress: false
jobs:
  issue:
    uses: BOAZ-website/engineering-playbook/.github/workflows/repo-rule-keeper-issue.yml@v2
